<!DOCTYPE html>
<html>
<head>
    <title>Edit Report</title>
    <style>body { font-family: sans-serif; padding: 40px; background: #f4f4f4; }</style>
</head>
<body>
    <div style="background: white; padding: 20px; max-width: 500px; margin: auto; border-radius: 8px;">
        <h2>Edit Report</h2>
        <form method="POST">
            <label>Report Name:</label>
            <input type="text" name="name" value="{{ report.name }}" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
            
            <label>Link URL:</label>
            <input type="text" name="link" value="{{ report.link }}" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
            
            <label>Group Access:</label>
            <select name="group" style="width: 100%; padding: 8px; margin-bottom: 20px;">
                <option value="Logistics" {% if report.group_access == 'Logistics' %}selected{% endif %}>Logistics</option>
                <option value="Sales" {% if report.group_access == 'Sales' %}selected{% endif %}>Sales</option>
                <option value="HR" {% if report.group_access == 'HR' %}selected{% endif %}>HR</option>
            </select>
            
            <button type="submit" style="padding: 12px 25px; background: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Update Report</button>
            <a href="/admin" style="margin-left: 10px;">Cancel</a>
        </form>
    </div>
</body>
</html>
