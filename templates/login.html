<!DOCTYPE html>
<html>
<head>
    <title>GAC Portal Login</title>
    <style>
        /* Brand Colors defined here */
        :root {
            --brand-blue: #003366;
            --brand-yellow: #ffcc00;
        }
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
        .login-box { background: white; padding: 40px 50px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        /* Placeholder for logo */
        .logo-placeholder { color: var(--brand-blue); font-weight: bold; font-size: 2em; margin-bottom: 20px; display: inline-block; padding: 10px 20px; border: 3px solid var(--brand-blue); border-radius: 10px; }
        h2 { color: var(--brand-blue); margin-top: 0; }
        input { display: block; margin: 15px 0; padding: 12px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: var(--brand-blue); color: white; border: none; border-radius: 4px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: var(--brand-yellow); color: var(--brand-blue); }
        .flash-msg { color: #d9534f; background: #f2dede; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo-placeholder">GAC</div>
        <h2>Internal Portal</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="flash-msg">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Secure Login</button>
        </form>
    </div>
</body>
</html>
