<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>
    <style>body { font-family: sans-serif; padding: 40px; background: #f4f4f4; }</style>
</head>
<body>
    <div style="background: white; padding: 20px; max-width: 500px; margin: auto; border-radius: 8px;">
        <h2>Edit User: {{ user.email }}</h2>
        <form method="POST">
            <label>Email:</label>
            <input type="email" name="email" value="{{ user.email }}" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
            
            <label>Role:</label>
            <select name="role" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                <option value="Logistics" {% if user.role == 'Logistics' %}selected{% endif %}>Logistics</option>
                <option value="Sales" {% if user.role == 'Sales' %}selected{% endif %}>Sales</option>
                <option value="HR" {% if user.role == 'HR' %}selected{% endif %}>HR</option>
                <option value="GM" {% if user.role == 'GM' %}selected{% endif %}>GM</option>
            </select>
            
            <label>New Password (leave blank to keep current):</label>
            <input type="text" name="password" placeholder="New Password" style="width: 100%; padding: 8px; margin-bottom: 20px;">
            
            <button type="submit" style="padding: 12px 25px; background: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Update User</button>
            <a href="/admin" style="margin-left: 10px;">Cancel</a>
        </form>
    </div>
</body>
</html>
